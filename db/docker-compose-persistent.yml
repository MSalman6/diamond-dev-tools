version: '3.8'

networks:
  monitor-net:
    driver: bridge

volumes:
  db-data:
    name: diamond-dev-tools-db-data
    driver: local
  grafana-data:
    name: diamond-dev-tools-grafana-data
    driver: local
  redis-data:
    name: diamond-dev-tools-redis-data
    driver: local

services:
  db:
    #image: postgres:15.3
    build: .
    env_file:
      - ../.env
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DMD_DB_POSTGRES_PASS}
    ports:
      - '127.0.0.1:${DMD_DB_POSTGRES_PORT}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    # command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    networks:
      - monitor-net

  pgadmin:
    build: ./pgadmin 
    env_file:
      - ../.env
    ports:
      - '127.0.0.1:3002:80'
    environment:
      - PGADMIN_DEFAULT_EMAIL=nobody@bit.diamonds
      - PGADMIN_DEFAULT_PASSWORD=${DMD_PGADMIN_PASS:?set DMD_PGADMIN_PASS in db/.env (distinct from DMD_DB_POSTGRES_PASS)}
    networks:
      - monitor-net

  grafana:
    image: grafana/grafana
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    environment:
      - GF_RENDERING_SERVER_URL=http://grafana_renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
      - GF_LOG_FILTERS=rendering:debug
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"
  grafana_renderer:
    image: grafana/grafana-image-renderer:latest
    ports:
      - "127.0.0.1:3001:8081"
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - monitor-net
    labels:
      org.label-schema.group: "monitoring"

  express:
    build: ./express
    env_file:
      - ../.env
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-9990}:${PORT:-9990}"
    environment:
      - NODE_ENV=development
      - POSTGRES_PASSWORD=${DMD_DB_POSTGRES_PASS}
      - REDIS_URL=redis://redis:6379
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-9990}
      - RPC_URL=${RPC_URL_DOCKER}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./express/src:/app/src
    depends_on:
      - db
      - redis
    networks:
      - monitor-net

